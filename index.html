<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>ASTRA</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles/game.css">
  <link rel="stylesheet" href="styles/intro.css">
  <link rel="stylesheet" href="styles/jobs.css">
</head>
<body>
  <div id="stage">
    <canvas id="game" width="1920" height="1080" role="img" aria-label="The Mars base: tap rooms, drones and the Rover"></canvas>

    <div id="loading">
      <section class="title-panel" aria-label="ASTRA mission">
        <h1 class="logo">ASTRA</h1>
        <div class="sub"></div>
        <div id="loadbar" role="progressbar" aria-label="Loading mission" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i></div>
        <button id="startBtn" hidden>Start mission</button>
      </section>
    </div>
    <button id="skipBtn" hidden>Skip &gt;&gt;</button>
    <button id="introStart" hidden>START MISSION</button>

    <div id="hud" hidden>
      <div id="clock"></div>
      <div id="gauges"></div>
      <div id="speed"><button data-speed="0" title="Pause" aria-label="Pause">II</button><button data-speed="1" class="on" aria-label="Normal speed">1x</button><button data-speed="3" aria-label="Speed times 3">3x</button><button data-speed="8" aria-label="Speed times 8">8x</button></div>
      <div id="uisize" title="Interface size"><button data-ui="-1" aria-label="Smaller interface">A-</button><button data-ui="1" aria-label="Bigger interface">A+</button></div>
      <button id="muteBtn" title="Sound on / off" aria-label="Sound on or off">🔊</button>
      <button id="settingsBtn" title="Settings" aria-label="Settings" aria-haspopup="dialog">⚙</button>
    </div>

    <div id="side" hidden>
      <section id="crewPanel"><h3>Crew</h3><div id="crewList"></div></section>
      <section id="actions"><h3>Base</h3><div id="selected"></div><button id="shelterBtn">Shelter order: off</button></section>
      <section id="goals"><h3>Goals</h3><ul id="goalList"></ul></section>
    </div>

    <div id="astra" class="closed" role="status" aria-live="polite">
      <div class="badge">ASTRA 6.7 // STATION AI</div>
      <div class="body"><canvas id="astraFace" width="96" height="96"></canvas><div id="astraText"></div></div>
      <button id="astraMore" aria-expanded="false" aria-controls="astraDetail">More</button>
      <div id="astraDetail" hidden></div>
      <button id="astraBtn">Got it</button>
    </div>

    <div id="toast" hidden></div>
    <div id="mgWrap" hidden role="dialog" aria-modal="true" aria-label="Mini-game"><button id="mgBack" type="button" title="Leave this job (Esc)">&larr; Back</button><div class="mgTitle"></div><canvas id="mg" width="1100" height="620"></canvas><div class="mgHint"></div></div>
    <div id="summary" hidden></div>
  </div>
  <div id="rotate" role="alert"><div class="phone" aria-hidden="true"></div><p>Turn your device sideways</p><small>ASTRA is played in landscape.</small></div>
  <script type="module" src="src/main.js"></script>
  <script type="module" src="src/ui/version.js"></script>
</body>
</html>
